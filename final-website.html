<style>
  /* Layout: one featured card for the owner, then a strict 2-column grid of friend cards, photo on top */
  :root {
    --bg: #15121f;
    --card: #211c31;
    --card-hover: #2a2440;
    --text: #f4f0fb;
    --muted: #a99fc2;
    --accent: #ff6b8a;
    --line: #342d4b;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  .kicker {
    font-size: 12px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 8px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 3.25rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .sub { color: var(--muted); margin: 0; max-width: 46ch; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .card {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
    padding: 20px 12px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    color: inherit; text-decoration: none;
    text-align: center;
    min-width: 0;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .card.me { grid-column: 1 / -1; flex-direction: row; text-align: left; gap: 18px; padding: 18px; }
  .card.me .info { align-items: flex-start; }

  .photo {
    --size: min(34vw, 150px);
    width: var(--size); aspect-ratio: 1; border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 200deg, #ff6b8a, #ffb86b, #b56bff, #ff6b8a);
    flex: none;
  }
  .card.me .photo { --size: min(30vw, 120px); }
  .photo img, .photo .ph {
    display: block; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover;
    border: 3px solid var(--card);
    background: var(--hue);
  }
  .photo .ph {
    display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 800;
    font-size: calc(var(--size) * 0.42);
    color: #fff;
  }

  .info { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; max-width: 100%; }
  .name { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; line-height: 1.15; }
  .user { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
  .go {
    margin-top: 8px; font-size: 0.8rem; font-weight: 600; color: var(--accent);
    letter-spacing: 0.04em;
  }
  footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Instagram</p>
    <h1>Me and My Friends</h1>
    <p class="sub">Kisi bhi card par tap karo, seedha unka Instagram profile khul jayega.</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>Profile khulne par naye tab me Instagram dikhega.</footer>
</div>

  var grid = document.getElementById("grid");
  people.forEach(function (p) {
    var a = document.createElement("a");
    a.className = "card" + (p.me ? " me" : "");
    a.href = "https://www.instagram.com/" + p.user + "/";
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("aria-label", p.name + " ka Instagram profile, @" + p.user);

    var ph = document.createElement("div");
    ph.className = "photo";
    if (p.photo) {
      var img = document.createElement("img");
      img.src = p.photo; img.alt = p.name + " ki profile photo";
      ph.appendChild(img);
    } else {
      var d = document.createElement("div");
      d.className = "ph"; d.style.setProperty("--hue", p.hue);
      d.textContent = p.name.charAt(0).toUpperCase();
      d.setAttribute("aria-hidden", "true");
      ph.appendChild(d);
    }

    var info = document.createElement("div");
    info.className = "info";
    var n = document.createElement("span"); n.className = "name"; n.textContent = p.name;
    var u = document.createElement("span"); u.className = "user"; u.textContent = "@" + p.user;
    var g = document.createElement("span"); g.className = "go"; g.textContent = "Profile dekho →";
    info.appendChild(n); info.appendChild(u); info.appendChild(g);

    a.appendChild(ph); a.appendChild(info);
    grid.appendChild(a);
  });
